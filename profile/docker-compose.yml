services:
  tomcat:
    image: tomcat:11.0.10-jdk17
    container_name: tomcat
    ports:
      - "8080:8080"
      - "5786:5786"
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      TZ: Asia/Shanghai
      UMASK: "0022"
    volumes:
      - "./tomcat/apps:/usr/local/tomcat/webapps"
      - "./tomcat/log:/usr/local/tomcat/logs"
      - "./tomcat/config:/usr/local/tomcat/conf"
      - "./nginx/file:/usr/local/tomcat/file"
    networks:
      - creezen
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [  "CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 2s
      retries: 100
      start_period: 20s
  mysql:
    image: mysql:8.0.26
    container_name: mysql
    ports:
      - "3307:3307"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 362203
      MYSQL_USER: creezen
      MYSQL_PASSWORD: 362203
      MYSQL_DATABASE: tianji
    volumes:
      - "./mysql/conf:/etc/mysql/"
      - "./mysql/data:/var/lib/mysql"
      - "./mysql/init:/docker-entrypoint-initdb.d"
      - "./mysql/uploads:/var/lib/mysql-files"
    networks:
      - creezen
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "creezen", "-p$$MYSQL_PASSWORD", "-P", "3307"]
      interval: 5s
      timeout: 2s
      retries: 100
      start_period: 20s
  redis:
    image: redis:6.2.20
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - "./redis/conf:/usr/local/etc/redis"
      - "./redis/data:/data"
    networks:
      - creezen
    command: redis-server /usr/local/etc/redis/redis.conf
  nginx:
    image: nginx:1.31.2
    container_name: nginx
    ports:
      - "80:80"
    environment:
      TZ: Asia/Shanghai
      FILE_PATH: ${FILE_PATH}
    volumes:
      - "./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf"
      - "./nginx/templates:/etc/nginx/templates"
      - "./nginx/web:/usr/share/nginx/html"
      - "./nginx/log:/var/log/nginx"
      - "./nginx/file:/etc/nginx/file"
    networks:
      - creezen
    depends_on:
      tomcat:
        condition: service_healthy
  flyway:
    image: flyway/flyway:13-alpine-mongo
    container_name: flyway
    volumes:
      - "./mysql/migration:/flyway/sql"
      - "./mysql/conf:/flyway/conf"
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3307/tianji?characterEncoding=UTF-8&&serverTimezone=UTC&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: root
      FLYWAY_PASSWORD: 362203
      FLYWAY_BASELINE_ON_MIGRATE: true
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - creezen
    command: migrate
networks:
  creezen:
    external: true